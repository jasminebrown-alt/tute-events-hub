        </div>
      </sc-for>
      <sc-if value="{{noDeclined}}" hint-placeholder-val="{{ false }}"><div style="padding: 18px 20px; border-top: 1px solid rgba(0,46,56,0.08); font: 400 13.5px/1.4 Inter, sans-serif; color: #5B6F74">Nothing declined yet.</div></sc-if>
    </div>
  </sc-if>
</div>
</sc-if>

<!-- ================= BUDGET & SPEND ================= -->
<sc-if value="{{isSpend}}" hint-placeholder-val="{{ false }}">
<div class="pagepad" style="padding: 44px 48px 64px; display: flex; flex-direction: column; gap: 22px">
  <div>
    <div style="font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #C21F62; margin-bottom: 16px">All events</div>
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap"><h1 class="gruffy" style="font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; margin: 0">Budget &amp; spend</h1>
    <sc-if value="{{canEdit}}" hint-placeholder-val="{{ true }}"><button type="button" data-on-click="{{setAnnual}}" style="border: 1px solid rgba(0,46,56,0.16); background: #FFFFFF; color: #002E38; border-radius: 999px; padding: 9px 14px; font: 600 12.5px/1 Inter, sans-serif; display: inline-flex; gap: 6px; align-items: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>Set budget</button></sc-if></div>
    <p style="font: 400 16px/1.6 Inter, sans-serif; color: #5B6F74; max-width: 760px; margin: 12px 0 0">Every event’s cost lines added up in one place. Figures come straight from each event’s Budget tab, so update costs there and this page follows. Amounts are ex VAT.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{spKpis}}" as="k" hint-placeholder-count="5"><div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 8px"><span class="th">{{k.k}}</span><span class="gruffy" style="font-size: 28px; font-weight: 600; line-height: 1; color: {{k.color}}">{{k.v}}</span><span style="font: 400 12.5px/1.35 Inter, sans-serif; color: #5B6F74">{{k.sub}}</span></div></sc-for>
  </div>
  <div style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start">
    <div class="card" style="padding: 22px 24px; display: flex; flex-direction: column; gap: 12px">
      <span class="eyebrow">Spend against budget</span>
      <sc-for list="{{spBars}}" as="b" hint-placeholder-count="4"><div style="display: grid; grid-template-columns: 90px minmax(0, 1fr) 80px; gap: 12px; align-items: center; font: 500 13px/1 Inter, sans-serif"><span>{{b.k}}</span><span style="height: 10px; border-radius: 6px; background: #F3E9DC; overflow: hidden; display: block"><span style="display: block; height: 100%; width: {{b.pct}}%; background: {{b.c}}"></span></span><span style="font-weight: 700; text-align: right">{{b.v}}</span></div></sc-for>
    </div>
    <div class="card" style="padding: 22px 24px 10px">
      <span class="eyebrow">By term</span>
      <sc-for list="{{spByTerm}}" as="t" hint-placeholder-count="2"><div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(0,46,56,0.08); margin-top: 10px; font: 500 13.5px/1.3 Inter, sans-serif"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">{{t.label}}</span><span style="font-size: 12px; color: #5B6F74">{{t.n}} events</span></span><span style="display: flex; flex-direction: column; gap: 3px; text-align: right"><span style="font-weight: 700">{{t.forecastL}}</span><span style="font-size: 12px; color: #5B6F74">{{t.actualL}} paid</span></span></div></sc-for>
    </div>
  </div>
  <div class="card" style="overflow: hidden">
    <div style="padding: 18px 20px 12px; display: flex; justify-content: space-between; align-items: baseline"><span class="eyebrow">By event</span><span style="font: 400 12.5px/1.3 Inter, sans-serif; color: #5B6F74">Click an event to edit its costs</span></div>
    <div style="display: grid; grid-template-columns: 2fr 0.8fr 1fr 1fr 1fr 1fr 0.6fr 0.9fr; gap: 12px; padding: 12px 20px; background: #F7F0E8"><span class="th">Event</span><span class="th">Date</span><span class="th">Forecast</span><span class="th">Committed</span><span class="th">Paid</span><span class="th">Still to pay</span><span class="th">Leads</span><span class="th">Cost per lead</span></div>
    <sc-for list="{{spRows}}" as="r" hint-placeholder-count="6">
      <button type="button" data-on-click="{{r.open}}" style="display: grid; grid-template-columns: 2fr 0.8fr 1fr 1fr 1fr 1fr 0.6fr 0.9fr; gap: 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid rgba(0,46,56,0.08); background: #FFFFFF; padding: 13px 20px; align-items: center; font: 500 13.5px/1.35 Inter, sans-serif; color: #002E38"><span style="font-weight: 600">{{r.name}}</span><span style="color: #5B6F74">{{r.date}}</span><span style="font-weight: 700">{{r.forecastL}}</span><span>{{r.committedL}}</span><span style="color: #0B6433">{{r.actualL}}</span><span>{{r.toPayL}}</span><span>{{r.leadsL}}</span><span>{{r.cplL}}</span></button>
    </sc-for>
  </div>
  <div class="card" style="overflow: hidden">
    <div style="padding: 18px 20px 12px; display: flex; justify-content: space-between; align-items: baseline"><span class="eyebrow">Still to pay · {{spToPayL}}</span><span style="font: 400 12.5px/1.3 Inter, sans-serif; color: #5B6F74">Anything not marked Paid, soonest event first</span></div>
    <div style="display: grid; grid-template-columns: 1.6fr 2fr 1.4fr 1fr 1fr; gap: 12px; padding: 12px 20px; background: #F7F0E8"><span class="th">Event</span><span class="th">Item</span><span class="th">Supplier</span><span class="th">Amount</span><span class="th">Status</span></div>
    <sc-for list="{{spUnpaid}}" as="u" hint-placeholder-count="5">
      <button type="button" data-on-click="{{u.open}}" style="display: grid; grid-template-columns: 1.6fr 2fr 1.4fr 1fr 1fr; gap: 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid rgba(0,46,56,0.08); background: #FFFFFF; padding: 12px 20px; align-items: center; font: 500 13.5px/1.35 Inter, sans-serif; color: #002E38"><span style="font-weight: 600">{{u.ev}}</span><span>{{u.item}}</span><span style="color: #5B6F74">{{u.supplier}}</span><span style="font-weight: 700">{{u.amountL}}</span><span><span class="pill" style="background: {{u.status.bg}}; color: {{u.status.fg}}">{{u.status.label}}</span></span></button>
    </sc-for>
    <sc-if value="{{spNoUnpaid}}" hint-placeholder-val="{{ false }}"><div style="padding: 18px 20px; border-top: 1px solid rgba(0,46,56,0.08); color: #5B6F74; font: 400 13.5px/1.4 Inter, sans-serif">Everything’s marked paid.</div></sc-if>
  </div>
</div>
</sc-if>

<!-- ================= HISTORY ================= -->
<sc-if value="{{isHist}}" hint-placeholder-val="{{ false }}">
<div class="pagepad" style="padding: 44px 48px 64px">
  <div style="font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #C21F62; margin-bottom: 16px">Results archive</div>
  <h1 class="gruffy" style="font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 12px">Past events 2025-26</h1>
  <p style="font: 400 16px/1.6 Inter, sans-serif; color: #5B6F74; max-width: 720px; margin: 0 0 28px">Last year’s results feed the “Last time” panel on this year’s matching events, so you can compare before you plan.</p>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px">
    <sc-for list="{{histKpis}}" as="k" hint-placeholder-count="4">
      <div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 8px"><span class="th">{{k.k}}</span><span class="gruffy" style="font-size: 30px; font-weight: 600; line-height: 1">{{k.v}}</span><span style="font: 400 12.5px/1.3 Inter, sans-serif; color: #5B6F74">{{k.sub}}</span></div>
    </sc-for>
  </div>
  <div class="card" style="overflow: hidden">
    <div style="display: grid; grid-template-columns: 2.4fr 0.9fr 1fr 1.5fr 1fr 0.8fr 0.9fr 0.6fr 0.8fr 0.8fr 0.9fr; gap: 10px; padding: 14px 20px; background: #F7F0E8">
      <span class="th">Event</span><span class="th">Date</span><span class="th">Status</span><span class="th">Type</span><span class="th">Location</span><span class="th">Cost</span><span class="th">Capture</span><span class="th">Leads</span><span class="th">Per lead</span><span class="th">Re-book</span><span class="th">Doc</span>
    </div>
    <sc-for list="{{histRows}}" as="h" hint-placeholder-count="11">
      <div style="display: grid; grid-template-columns: 2.4fr 0.9fr 1fr 1.5fr 1fr 0.8fr 0.9fr 0.6fr 0.8fr 0.8fr 0.9fr; gap: 10px; padding: 13px 20px; border-top: 1px solid rgba(0,46,56,0.08); align-items: center; font: 500 13px/1.35 Inter, sans-serif">
        <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">{{h.name}}</span><span style="font: 400 11.5px/1.2 Inter, sans-serif; color: #5B6F74">{{h.owners}}</span></span>
        <span>{{h.date}}</span>
        <span><span class="pill" style="background: {{h.status.bg}}; color: {{h.status.fg}}">{{h.status.label}}</span></span>
        <span style="color: #5B6F74">{{h.type}}</span>
        <span style="color: #5B6F74">{{h.location}}</span>
        <span>{{h.cost}}</span>
        <span style="color: #5B6F74">{{h.capture}}</span>
        <span class="gruffy" style="font-size: 18px; font-weight: 600">{{h.leads}}</span>
        <span style="font-weight: 700">{{h.cpl}}</span>
        <span><span class="pill" style="background: {{h.rebook.bg}}; color: {{h.rebook.fg}}">{{h.rebook.label}}</span></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><sc-if value="{{h.hasDoc}}" hint-placeholder-val="{{ true }}"><a href="{{h.doc}}" target="_blank" rel="noopener" style="font-weight: 600; color: #002E38">Event doc</a></sc-if><sc-if value="{{h.hasProg}}" hint-placeholder-val="{{ false }}"><a href="{{h.prog}}" target="_blank" rel="noopener" style="font-weight: 600; color: #002E38">Programme</a></sc-if><sc-if value="{{h.noDoc}}" hint-placeholder-val="{{ false }}"><span style="color: #62767A">-</span></sc-if></span>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; gap: 8px; align-items: center; margin-top: 14px; font: 400 12.5px/1.4 Inter, sans-serif; color: #5B6F74"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"></path><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>Cost per lead only shows where both a stand cost and a lead count were recorded.</div>
</div>
</sc-if>

<!-- ================= EVENT WORKSPACE ================= -->
<sc-if value="{{isEvent}}" hint-placeholder-val="{{ false }}">
<div class="pagepad" style="padding: 32px 48px 64px; display: flex; flex-direction: column; gap: 18px">

  <div class="card evhead" style="padding: 28px 30px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 12px; min-width: 0">
      <div style="font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #C21F62">{{ev.type}} · {{ev.termL}}</div>
      <h1 class="gruffy" style="font-weight: 600; font-size: 38px; line-height: 1.05; letter-spacing: -0.02em; margin: 0">{{ev.name}}</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 8px 18px; font: 500 13.5px/1.3 Inter, sans-serif; color: #5B6F74; margin-top: 2px">
        <span style="display: flex; gap: 7px; align-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path></svg>{{c.dateLabel}}</span>
        <span style="display: flex; gap: 7px; align-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11Z"></path><path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"></path></svg>{{ev.venue}}, {{ev.city}}</span>
        <span style="display: flex; gap: 7px; align-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 3h7v7H3Z"></path><path d="M14 3h7v7h-7Z"></path><path d="M3 14h7v7H3Z"></path><path d="M14 14h7v7h-7Z"></path></svg>{{ev.standL}}</span>
        <span style="display: flex; gap: 7px; align-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path></svg>Owner: {{owner.name}}</span>
        <sc-if value="{{hasCover}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: #E4EAF6; color: #34497A">Cover: {{cover}}</span></sc-if>
      </div>
    </div>
    <div style="display: flex; gap: 28px; align-items: center; flex-shrink: 0">
      <div style="display: flex; flex-direction: column; gap: 10px; width: 210px">
        <span class="pill" style="align-self: flex-start; background: {{c.statusP.bg}}; color: {{c.statusP.fg}}">{{c.statusP.label}}</span>
        <div style="display: flex; justify-content: space-between; font: 500 12.5px/1 Inter, sans-serif; color: #5B6F74"><span>{{c.done}}/{{c.total}} tasks</span><span style="font-weight: 700; color: #002E38">{{c.progress}}%</span></div>
        <div style="height: 8px; border-radius: 5px; background: #F3E9DC; overflow: hidden"><div style="height: 100%; width: {{c.progress}}%; background: {{c.barColor}}"></div></div>
      </div>
      <div style="padding-left: 28px; border-left: 1px solid rgba(0,46,56,0.1); display: flex; flex-direction: column; align-items: flex-start; min-width: 96px">
        <span class="gruffy" style="font-size: 48px; font-weight: 600; line-height: 1">{{c.daysNum}}</span>
        <span style="font: 500 12.5px/1.3 Inter, sans-serif; color: #5B6F74">{{c.daysWord}}</span>
      </div>
    </div>
  </div>

  <sc-if value="{{c.hasAlerts}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 14px; background: #FFF5F8; border: 1px solid rgba(224,54,124,0.35)">
      <span style="display: flex; gap: 8px; align-items: center; font: 700 13px/1 Inter, sans-serif; color: #951F51"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>Needs attention</span>
      <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
        <button type="button" data-on-click="{{a.go}}" style="border: 1px solid rgba(224,54,124,0.35); background: #FFFFFF; border-radius: 999px; padding: 7px 12px; font: 600 12.5px/1 Inter, sans-serif; color: #951F51; display: flex; gap: 6px; align-items: center">{{a.label}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button>
      </sc-for>
    </div>
  </sc-if>

  <div role="tablist" aria-label="Event sections" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; border-radius: 14px; background: #FFFFFF; border: 1px solid rgba(0,46,56,0.12); box-shadow: 0 1px 2px rgba(0,46,56,.06)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="11">
      <button type="button" role="tab" data-on-click="{{t.pick}}" style="border: 0; border-radius: 10px; padding: 9px 12px; font: 600 13px/1 Inter, sans-serif; display: flex; gap: 7px; align-items: center; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}<sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; font: 700 10.5px/18px Inter, sans-serif; text-align: center; background: {{t.badgeBg}}; color: {{t.badgeFg}}">{{t.badge}}</span></sc-if></button>
    </sc-for>
  </div>

  <!-- ---------- OVERVIEW ---------- -->
  <sc-if value="{{tab.overview}}" hint-placeholder-val="{{ true }}">
  <div style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; align-items: start">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <div class="card" style="padding: 24px">
        <div class="eyebrow" style="margin-bottom: 12px">Event summary</div>
        <p style="font: 400 15px/1.6 Inter, sans-serif; margin: 0 0 18px">{{ev.summary}}</p>
        <div class="th" style="margin-bottom: 8px">Event objective</div>
        <p style="font: 600 15px/1.5 Inter, sans-serif; margin: 0 0 12px">{{ev.objective}}</p>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{objectives}}" as="o" hint-placeholder-count="3"><span style="display: flex; gap: 10px; align-items: flex-start; font: 400 14px/1.45 Inter, sans-serif"><span style="color: #1F9D57; display: flex; padding-top: 2px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 6 9 17l-5-5"></path></svg></span>{{o.s}}</span></sc-for>
        </div>
      </div>
      <div class="card" style="padding: 8px 24px 12px">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 0 6px"><span class="eyebrow">Event details</span><span style="display: flex; gap: 8px; align-items: center"><span class="btag"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path></svg>Also shown in briefing</span><sc-if value="{{canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" data-on-click="{{editEvent}}" style="border: 1px solid rgba(0,46,56,0.16); background: #FFFFFF; color: #002E38; border-radius: 999px; padding: 6px 11px; font: 600 12px/1 Inter, sans-serif; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>Edit</button></sc-if></span></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px">
          <sc-for list="{{details}}" as="r" hint-placeholder-count="10"><div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 0; border-top: 1px solid rgba(0,46,56,0.08)"><div style="display: flex; align-items: center; gap: 8px"><span class="th">{{r.k}}</span><sc-if value="{{r.brief}}" hint-placeholder-val="{{ false }}"><span class="btag"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path></svg>Briefing</span></sc-if></div><sc-if value="{{r.ok}}" hint-placeholder-val="{{ true }}"><div style="font: 500 14.5px/1.45 Inter, sans-serif; color: #002E38">{{r.v}}</div></sc-if><sc-if value="{{r.missing}}" hint-placeholder-val="{{ false }}"><div style="font: 600 14px/1.45 Inter, sans-serif; color: #C21F62; display: flex; gap: 6px; align-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>{{r.v}}</div></sc-if><sc-if value="{{r.hasExtra}}" hint-placeholder-val="{{ false }}"><div style="font: 400 12px/1.3 Inter, sans-serif; color: #5B6F74">{{r.extra}}</div></sc-if></div></sc-for>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 18px">
      <sc-if value="{{hasLast}}" hint-placeholder-val="{{ true }}">
      <div style="background: #002E38; color: #FFFFFF; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font: 600 11px/1 Inter, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #66FF94">Last time · {{last.date}}</span><span class="pill" style="background: {{last.rebook.bg}}; color: {{last.rebook.fg}}">Re-book: {{last.rebook.label}}</span></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 5px"><span class="gruffy" style="font-size: 30px; font-weight: 600; line-height: 1; color: #66FF94">{{last.leads}}</span><span style="font: 500 12px/1.2 Inter, sans-serif; color: #BFCBCD">Leads</span></div>

        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"></path><path d="M8.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path><path d="m21 15-5-5L5 21"></path></svg>
        <span style="font: 600 14px/1.3 Inter, sans-serif; color: #002E38">Stand render or photo</span>

    </div>
    <sc-if value="{{hasBag}}" hint-placeholder-val="{{ true }}">

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px"><span class="eyebrow">In every tote bag</span><span class="btag"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path></svg>Briefing</span></div>

    <sc-if value="{{assocOn}}" hint-placeholder-val="{{ false }}"><button type="button" data-on-click="{{toggleAssoc}}" style="flex-shrink: 0; border: 1px solid rgba(0,46,56,0.18); border-radius: 999px; padding: 9px 14px; background: #FFFFFF; color: #002E38; font: 600 12.5px/1 Inter, sans-serif">Return to managers</button></sc-if>

 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 3h7v7H3Z"></path><path d="M14 3h7v7h-7Z"></path><path d="M3 14h7v7H3Z"></path><path d="M14 14h7v7h-7Z"></path></svg></span><span style="display: flex; flex-direction: column; gap: 5px; min-width: 0"><span style="font: 600 10px/1 Inter, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #BFCBCD">{{bv.fStandK}}</span><span style="font: 600 14.5px/1.3 Inter, sans-serif; color: #FFFFFF">{{bv.fStand}}</span></span></div><div style="background: rgba(255,255,255,0.07); border-radius: 14px; padding: 14px; display: flex; gap: 11px; align-items: flex-start"><span style="color: #66FF94; display: flex; padding-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"></path><path d="M12 6v6l4 2"></path></svg></span><span style="display: flex; flex-direction: column; gap: 5px; min-width: 0"><span style="font: 600 10px/1 Inter, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #BFCBCD">Arrive</span><span style="font: 600 14.5px/1.3 Inter, sans-serif; color: #FFFFFF">{{bv.fArrive}}</span></span></div>

<sc-if value="{{edOpen}}" hint-placeholder-val="{{ false }}">

  <div style="width: 100%; max-width: 620px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,46,56,0.3); padding: 26px 28px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><h2 style="font: 600 20px/1.2 Inter, sans-serif; margin: 0">{{ed.title}}</h2><button type="button" data-on-click="{{ed.cancel}}" aria-label="Close" style="border: 0; background: #F7F0E8; color: #002E38; width: 34px; height: 34px; border-radius: 999px; font: 600 18px/1 Inter, sans-serif">×</button></div>

      <div style="display: flex; flex-direction: column; gap: 7px">
        <label for="{{f.id}}" style="font: 600 12.5px/1.2 Inter, sans-serif; color: #2D4A51">{{f.label}}</label>
        <sc-if value="{{f.isText}}" hint-placeholder-val="{{ true }}"><input id="{{f.id}}" type="text" value="{{f.value}}" data-on-change="{{f.change}}"></sc-if>
        <sc-if value="{{f.isNum}}" hint-placeholder-val="{{ false }}"><input id="{{f.id}}" type="text" inputmode="decimal" value="{{f.value}}" data-on-change="{{f.change}}" style="max-width: 200px"></sc-if>

  }

  const m = /^#brief-([A-Za-z0-9_-]+)$/.exec(location.hash || '');
  if (m) { app.state.screen = 'briefing'; app.state.eventId = m[1]; app.state.briefTab = 'glance'; }
  render();

  (async () => {
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) { hub.status = 'nodb'; schedule(); return; }
    hub.db = db;
    try { hub.user = await window.claude.use('user'); hub.uid = hub.user ? await hub.user.id() : null; app.canEdit = hub.user ? !!(await hub.user.canEdit()) : false; } catch (e) {}
    const fail = () => { if (!app.master) { hub.status = 'nodb'; schedule(); } };
    db.doc('master/data').onSnapshot((s) => { hub.masterRaw = s.exists ? s.data() : null; if (!s.exists) { hub.status = 'empty'; schedule(); } build(); }, fail);
    db.collection('events').onSnapshot((q) => { hub.events = q.docs.map((d) => d.data()); build(); }, fail);
    db.doc('state/shared').onSnapshot((s) => {
      const d = s.exists ? s.data() : {};
      for (const k of PERSIST) app.state[k] = Object.assign({}, d[k] || {});
      app.state.meta = Object.assign({}, d.meta || {});
      resolveNames(app.state.meta); schedule();
    }, () => {});
  })();
})();
</script>

</body>
</html>
