<html lang="en-GB">
<head>
<meta charset="utf-8">

<body style="margin:0">
<script>
/* Netlify bridge: gives the Hub the same window.claude.use('db' | 'user') it has in Claude,
   backed by /api (Netlify Function + Blobs) with a simple password login. */
(function () {
  var KEY = 'tute-hub-login';
  var KNOWN = { 'u_oPhXm7LM7gilSvq9ahF1tw': 'Jasmine Brown' };
  var auth = null;
  try { auth = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  var cache = null, listeners = [], readyResolve, ready = new Promise(function (r) { readyResolve = r; });

  function save() { try { auth ? localStorage.setItem(KEY, JSON.stringify(auth)) : localStorage.removeItem(KEY); } catch (e) {} }
  function signOut() { auth = null; save(); location.href = location.pathname; }
  window.tuteSignOut = signOut;

  function call(route, body) {
    return fetch('/api/' + route, {
      method: body ? 'POST' : 'GET',
      headers: { 'content-type': 'application/json', 'x-tute-pass': auth ? auth.pass : '' },
      body: body ? JSON.stringify(body) : undefined, cache: 'no-store'
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401 && route !== 'login') { signOut(); }
        if (!r.ok) { var e = new Error(j.error || 'Request failed'); e.code = r.status >= 500 || r.status === 409 ? 'unavailable' : 'permission_denied'; e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function notify() { listeners.forEach(function (fn) { try { fn(); } catch (e) {} }); }
  function refresh() { return call('all').then(function (j) { cache = j; notify(); }); }
  function poll() {
    if (document.hidden || !cache) return;
    call('rev').then(function (j) { if (j.rev !== cache.rev) refresh(); }).catch(function () {});
  }

  function docData(path) {
    if (!cache) return null;
    if (path === 'master/data') return cache.master;
    if (path === 'state/shared') return cache.state;
    var id = path.replace(/^events\//, '');
    return (cache.events || []).filter(function (e) { return e.id === id; })[0] || null;
  }
  function snap(path) { var d = docData(path); return { exists: !!d, data: function () { return d ? JSON.parse(JSON.stringify(d)) : undefined; } }; }
  function write(route, path, patch) { return call(route, { path: path, patch: patch }).then(function () { refresh().catch(function () {}); }); }

  var db = {
    doc: function (path) {
      return {
        get: function () { return Promise.resolve(snap(path)); },
        update: function (p) { return write('update', path, p); },
        set: function (p) { return write('set', path, p); },
        onSnapshot: function (next) { var fn = function () { next(snap(path)); }; listeners.push(fn); if (cache) setTimeout(fn, 0); return function () { listeners = listeners.filter(function (x) { return x !== fn; }); }; }
      };
    },
    collection: function () {
      return { onSnapshot: function (next) { var fn = function () { next({ docs: (cache.events || []).map(function (e) { return { data: function () { return JSON.parse(JSON.stringify(e)); } }; }) }); }; listeners.push(fn); if (cache) setTimeout(fn, 0); return function () {}; } };
    }
  };
  var user = {
    id: function () { return Promise.resolve(auth ? auth.name : null); },
    canEdit: function () { return Promise.resolve(!!auth && auth.role === 'marketing'); },
    profiles: function (ids) { var o = {}; ids.forEach(function (i) { o[i] = { name: KNOWN[i] || (/^u_/.test(i) ? '' : i) }; }); return Promise.resolve(o); }
  };
  window.claude = { use: function (n) { return ready.then(function () { return n === 'db' ? db : n === 'user' ? user : null; }); } };

  /* ---------- login + team picker UI ---------- */
  var css = document.createElement('style');
  css.textContent =
    '.tg{position:fixed;inset:0;z-index:9999;background:#F7F0E8;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:48px 16px;font-family:Inter,Arial,sans-serif;color:#002E38}' +
    '.tg .bx{width:100%;max-width:440px}.tg h1{font-family:Gruffy,Fredoka,Arial,sans-serif;font-weight:600;font-size:34px;line-height:1.1;margin:22px 0 8px}.tg p{color:#5B6F74;margin:0 0 22px;font-size:15px;line-height:1.5}' +
    '.tg .card{background:#fff;border:1px solid rgba(0,46,56,.12);border-radius:18px;padding:22px}.tg label{display:block;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5B6F74;margin:0 0 8px}' +
    '.tg input{width:100%;box-sizing:border-box;font:500 16px Inter,Arial,sans-serif;padding:13px 14px;border:1px solid rgba(0,46,56,.25);border-radius:12px;margin-bottom:16px;color:#002E38}' +
    '.tg button{font:600 15px Inter,Arial,sans-serif;border:0;border-radius:999px;padding:13px 20px;background:#002E38;color:#fff;cursor:pointer;width:100%}.tg .err{color:#B3245F;font-size:14px;min-height:20px;margin-top:10px}' +
    '.tg [hidden]{display:none!important}.tg .who{display:flex;gap:8px;margin-bottom:16px}.tg .who button{background:#fff;color:#002E38;border:1px solid rgba(0,46,56,.2)}.tg .who button.on{background:#002E38;color:#fff}' +
    '.tg a.ev{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid rgba(0,46,56,.12);border-radius:16px;padding:16px 18px;margin-bottom:10px;text-decoration:none;color:#002E38}' +
    '.tg a.ev b{display:block;font-size:16px}.tg a.ev small{color:#5B6F74;font-size:13px}.tg a.ev span{font-weight:600;font-size:13px;color:#1F9D57;white-space:nowrap}.tg .out{background:none;color:#5B6F74;width:auto;padding:8px 0;margin-top:14px;text-decoration:underline}' +
    'html.team .brief-bar button{display:none!important}.team-link{display:none}html.team .team-link{display:inline-flex}';
  document.head.appendChild(css);

  function overlay(html) { var o = document.querySelector('.tg'); if (!o) { o = document.createElement('div'); o.className = 'tg'; document.body.appendChild(o); } o.innerHTML = '<div class="bx"><img src="logo-dark.png" alt="Tute Education" style="height:26px">' + html + '</div>'; return o; }
  function closeOverlay() { var o = document.querySelector('.tg'); if (o) o.remove(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function showLogin(msg) {
    var o = overlay('<h1>Tute Events Hub</h1><p>Sign in with the password Marketing gave you.</p><div class="card"><form>' +
      '<label for="tgp">Password</label><input id="tgp" type="password" autocomplete="current-password" required>' +
      '<div class="who" hidden><button type="button" data-n="Jasmine Brown" class="on">Jasmine</button><button type="button" data-n="Kirstey Brierley">Kirstey</button></div>' +
      '<button type="submit">Sign in</button><div class="err" role="alert">' + esc(msg || '') + '</div></form></div>');
    var form = o.querySelector('form'), err = o.querySelector('.err'), who = o.querySelector('.who'), step2 = false;
    who.querySelectorAll('button').forEach(function (b) { b.onclick = function () { who.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); }; });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault(); err.textContent = '';
      if (step2) { auth.name = who.querySelector('.on').dataset.n; save(); start(); return; }
      auth = { pass: o.querySelector('#tgp').value, name: 'Team', role: null };
      call('login', {}).then(function (j) {
        auth.role = j.role;
        if (j.role === 'marketing') { step2 = true; who.hidden = false; form.querySelector('button[type=submit]').textContent = 'Continue'; err.textContent = ''; who.insertAdjacentHTML('beforebegin', '<label>Who are you?</label>'); }
        else { save(); start(); }
      }).catch(function (e) { auth = null; err.textContent = e.status === 401 ? 'That password didn’t work. Try again.' : (e.message || 'Couldn’t sign in. Check your connection.'); });
    });
  }

  function picker() {
    var today = new Date().toISOString().slice(0, 10);
    var evs = (cache.events || []).filter(function (e) { return String(e.end || e.start || '') >= today && (e.attendees || []).length; })
      .sort(function (a, b) { return String(a.start).localeCompare(String(b.start)); });
    var fmt = function (s) { try { return new Date(s + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return s; } };
    overlay('<h1>Your event briefings</h1><p>Everything you need before each event. Kept up to date by Marketing.</p>' +
      (evs.length ? evs.map(function (e) { return '<a class="ev" href="#brief-' + esc(e.id) + '" data-id="' + esc(e.id) + '"><div><b>' + esc(e.name) + '</b><small>' + esc(fmt(e.start)) + (e.venue ? ' · ' + esc(e.venue) : '') + '</small></div><span>Open →</span></a>'; }).join('') : '<div class="card">No upcoming briefings yet.</div>') +
      '<button class="out" type="button" onclick="tuteSignOut()">Sign out</button>');
    document.querySelectorAll('.tg a.ev').forEach(function (a) { a.onclick = function (ev) { ev.preventDefault(); location.hash = 'brief-' + a.dataset.id; location.reload(); }; });
  }

  function start() {
    overlay('<h1>Loading…</h1>');
    if (auth.role === 'team') document.documentElement.classList.add('team');
    refresh().then(function () {
      readyResolve();
      if (auth.role === 'team' && !/^#brief-/.test(location.hash)) picker(); else closeOverlay();
      setInterval(poll, 20000);
      document.addEventListener('visibilitychange', poll);
    }).catch(function (e) { if (e.status === 401) return; overlay('<h1>Couldn’t load</h1><p>' + esc(e.message || 'Check your connection and refresh the page.') + '</p><button type="button" onclick="location.reload()">Try again</button><button class="out" type="button" onclick="tuteSignOut()">Sign out</button>'); });
  }

  document.addEventListener('click', function (ev) {
    var a = ev.target.closest && ev.target.closest('a[href="#signout"]');
    if (a) { ev.preventDefault(); signOut(); }
    var x = ev.target.closest && ev.target.closest('a[href="#export"]');
    if (x) { ev.preventDefault(); call('export').then(function (j) { var blob = new Blob([JSON.stringify(j, null, 1)], { type: 'application/json' }); var u = URL.createObjectURL(blob); var a2 = document.createElement('a'); a2.href = u; a2.download = 'tute-events-hub-backup-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a2); a2.click(); a2.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 2000); }).catch(function (e) { alert(e.message || 'Couldn’t download the backup.'); }); }
    var im = ev.target.closest && ev.target.closest('a[href="#import"]');
    if (im) { ev.preventDefault(); var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json'; inp.onchange = function () { var f = inp.files && inp.files[0]; if (!f) return; f.text().then(function (t) { var j; try { j = JSON.parse(t); } catch (e2) { alert('That file isn’t a Hub update file.'); return; } var n = j.updates ? j.updates.length + ' change(s)' : 'a full restore'; if (!confirm('Apply ' + n + ' from "' + f.name + '"?' + (j.summary ? '\n\n' + j.summary : '') + '\n\nA backup is saved first.')) return; call('import', j).then(function (r) { refresh(); alert('Done - ' + r.applied + ' change(s) applied.'); }).catch(function (e3) { alert(e3.message || 'Couldn’t apply that file.'); }); }); }; inp.click(); }
    var b = ev.target.closest && ev.target.closest('a.team-link');
    if (b) { ev.preventDefault(); location.hash = ''; history.replaceState(null, '', location.pathname); location.reload(); }
  });

  if (auth && auth.pass && auth.role) start(); else showLogin();
})();

</script>
<title>Tute Events Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Gruffy';src:url(gruffy.woff2) format('woff2');font-weight:400 900;font-display:swap}
body{margin:0;font-family:Inter,Arial,system-ui,sans-serif;color:#002E38;background:#FBF8F4;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
a{color:#002E38}a:hover{color:#E0367C}
button{font-family:inherit;cursor:pointer}
.gruffy{font-family:Gruffy,Fredoka,Arial,sans-serif}
.card{background:#FFFFFF;border:1px solid rgba(0,46,56,.12);border-radius:16px;box-shadow:0 1px 2px rgba(0,46,56,.06),0 6px 18px rgba(0,46,56,.05)}
.eyebrow{font:600 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#62767A}

.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font:600 11.5px/1 Inter,sans-serif;white-space:nowrap}
.btag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;background:#DCEFF1;color:#0B5560;font:600 10px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.navitem:hover{background:rgba(255,255,255,.08)!important;color:#FFFFFF!important}
.evcard{transition:transform .16s ease,box-shadow .16s ease}
.evcard:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,46,56,.14)}
input,textarea{font:400 14px/1.45 Inter,sans-serif;color:#002E38;background:#F7F0E8;border:1px solid rgba(0,46,56,.14);border-radius:10px;padding:10px 12px;width:100%;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(102,255,148,.65)}
.tile{display:flex;gap:11px;align-items:flex-start;padding:14px;border-radius:14px;background:#F7F0E8;color:#002E38}
.tile>svg{margin-top:2px;color:#1F9D57}
.tile>span{display:flex;flex-direction:column;gap:4px;min-width:0}
.tk{font:600 10.5px/1.2 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#62767A}
.tv{font:600 14.5px/1.35 Inter,sans-serif;color:#002E38}
.ts{font:400 12.5px/1.4 Inter,sans-serif;color:#5B6F74}
.brow{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid rgba(0,46,56,.08)}
.bli{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font:400 14px/1.45 Inter,sans-serif}
.bli>svg{margin-top:3px;color:#1F9D57}
.scroll::-webkit-scrollbar{width:11px}.scroll::-webkit-scrollbar-thumb{background:rgba(0,46,56,.2);border-radius:8px;border:3px solid transparent;background-clip:content-box}

:root{--bg:#FBF8F4;--fg:#002E38;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg)}
#app{height:100%}
.boot{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font:500 15px/1.5 Inter,Arial,sans-serif;color:#5B6F74;text-align:center;padding-inline:16px}
.boot h1{font-family:Gruffy,Fredoka,Arial,sans-serif;font-weight:600;font-size:32px;color:#002E38;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#002E38;color:#fff;padding:10px 16px;border-radius:999px;font:600 13px/1.3 Inter,sans-serif;z-index:50;box-shadow:0 8px 24px rgba(0,46,56,.25)}
@media (prefers-reduced-motion: reduce){.evcard{transition:none}.evcard:hover{transform:none}}
@media (max-width: 860px){
 .app-root{flex-direction:column}
 .app-nav{display:none!important}
 .app-root [style*="grid-template-columns"]{grid-template-columns:minmax(0,1fr)!important}
 .pagepad{padding:24px 16px 48px!important}
 .app-header{padding:0 16px!important;overflow-x:auto}
 .brief-bar{flex-wrap:wrap;height:auto!important;padding:10px 16px!important;gap:10px!important}
 .brief-wrap{padding:16px 16px 48px!important}
 .brief-nav{position:static!important;flex-direction:row!important;overflow-x:auto}
 .brief-nav button{flex-shrink:0}
 .app-root h1.gruffy{font-size:30px!important}
 .evhead > div{flex-wrap:wrap}
 .brief-wrap [style*="border-left: 1px solid rgba(255,255,255,0.16)"]{border-left:0!important;padding-left:0!important;text-align:left!important}
 .brief-wrap [style*="repeat(4, minmax(0, 1fr))"]{grid-template-columns:repeat(2,minmax(0,1fr))!important;row-gap:14px}
}
</style>

<div id="app"></div>
<template id="tpl"><div class="app-root" style="width: 100%; height: 100%; display: flex; overflow: hidden; background: #FBF8F4; color: #002E38; font-family: Inter, Arial, system-ui, sans-serif">

<!-- ================= SIDEBAR ================= -->
<sc-if value="{{notBrief}}" hint-placeholder-val="{{ true }}">
<nav class="app-nav" aria-label="Events Hub" style="width: 264px; flex-shrink: 0; height: 100%; background: #002E38; color: #A9BCC0; display: flex; flex-direction: column; padding: 22px 0 20px; overflow-y: auto">
  <button type="button" data-on-click="{{goHub}}" aria-label="Events Hub home" style="background: none; border: 0; padding: 2px 22px 0; text-align: left; display: flex"><img src="logo-white.png" alt="Tute Education" style="height: 20px; width: auto; display: block"></button>
  <div style="font: 600 10px/1.4 Inter, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #8BA0A4; padding: 14px 22px 0">Events Hub</div>
  <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 20px 16px 12px"></div>
  <div style="flex-grow: 1; padding: 0 12px; display: flex; flex-direction: column; gap: 1px">
    <button type="button" class="navitem" data-on-click="{{goHub}}" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; border: 0; text-align: left; font: 500 13.5px/1.2 Inter, sans-serif; background: {{hubNavBg}}; color: {{hubNavFg}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"></path><path d="M9.5 21v-6h5v6"></path></svg><span>Events overview</span></button>
    <sc-for list="{{navTerms}}" as="t" hint-placeholder-count="2">
      <div style="font: 600 10px/1 Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8BA0A4; padding: 18px 12px 7px">{{t.title}}</div>
      <sc-for list="{{t.events}}" as="e" hint-placeholder-count="3">
        <button type="button" class="navitem" data-on-click="{{e.open}}" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 9px; border: 0; text-align: left; font: 500 13.5px/1.25 Inter, sans-serif; background: {{e.bg}}; color: {{e.fg}}">
          <span style="width: 17px; display: flex; justify-content: center; flex-shrink: 0"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{e.status.bg}}; box-shadow: 0 0 0 2px rgba(255,255,255,0.12)"></span></span>
          <span>{{e.short}}</span>
        </button>
      </sc-for>
    </sc-for>
    <div style="font: 600 10px/1 Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8BA0A4; padding: 18px 12px 7px">Shared records</div>
    <button type="button" class="navitem" data-on-click="{{goPipe}}" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; border: 0; text-align: left; font: 500 13.5px/1.2 Inter, sans-serif; background: {{pipeNavBg}}; color: {{pipeNavFg}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 4h18l-7 8v6l-4 2v-8Z"></path></svg><span style="flex-grow: 1">Pipeline</span><sc-if value="{{hasDecisions}}" hint-placeholder-val="{{ true }}"><span style="min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #E0367C; color: #FFFFFF; font: 700 10.5px/18px Inter, sans-serif; text-align: center">{{decisions}}</span></sc-if></button>
    <button type="button" class="navitem" data-on-click="{{goSpend}}" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; border: 0; text-align: left; font: 500 13.5px/1.2 Inter, sans-serif; background: {{spendNavBg}}; color: {{spendNavFg}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 7h18v12H3Z"></path><path d="M3 11h18"></path><path d="M7 15h4"></path></svg><span>Budget &amp; spend</span></button>
    <button type="button" class="navitem" data-on-click="{{goPeople}}" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; border: 0; text-align: left; font: 500 13.5px/1.2 Inter, sans-serif; background: {{peopleNavBg}}; color: {{peopleNavFg}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>People directory</span></button>
    <button type="button" class="navitem" data-on-click="{{goInv}}" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; border: 0; text-align: left; font: 500 13.5px/1.2 Inter, sans-serif; background: {{invNavBg}}; color: {{invNavFg}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg><span>Merchandise stock</span></button>
    <button type="button" class="navitem" data-on-click="{{goHist}}" style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; border: 0; text-align: left; font: 500 13.5px/1.2 Inter, sans-serif; background: {{histNavBg}}; color: {{histNavFg}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg><span>Past events 2025-26</span></button>

  </div>
  <div style="margin: 16px 16px 0; padding: 14px 16px; border-radius: 12px; background: rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 4px">
    <span style="font: 600 10px/1 Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #8BA0A4">Today</span>
    <span style="font: 500 13px/1.35 Inter, sans-serif; color: #FFFFFF">{{todayLabel}}</span>

</sc-if>

<!-- ================= MAIN COLUMN ================= -->
<div style="flex-grow: 1; min-width: 0; height: 100%; display: flex; flex-direction: column">

<!-- header -->
<sc-if value="{{notBrief}}" hint-placeholder-val="{{ true }}">
<header class="app-header" style="height: 60px; flex-shrink: 0; border-bottom: 1px solid rgba(0,46,56,0.12); display: flex; align-items: center; gap: 16px; padding: 0 28px; background: #FBF8F4">
  <div style="display: flex; align-items: center; gap: 8px; font: 500 13px/1 Inter, sans-serif; color: #5B6F74; min-width: 0">
    <button type="button" data-on-click="{{goHub}}" style="background: none; border: 0; padding: 0; font: 500 13px/1 Inter, sans-serif; color: #62767A">Events Hub</button>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m9 18 6-6-6-6"></path></svg>
    <span style="color: #002E38; font-weight: 600; white-space: nowrap">{{crumb}}</span>
    <sc-if value="{{hasCrumb2}}" hint-placeholder-val="{{ false }}">
      <span style="display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m9 18 6-6-6-6"></path></svg><span style="color: #002E38; font-weight: 600">{{crumb2}}</span></span>
    </sc-if>
  </div>
  <div style="flex-grow: 1"></div>
  <sc-if value="{{isEvent}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 10px">
      <sc-if value="{{isSample}}" hint-placeholder-val="{{ true }}"><span class="pill" style="background: #FFEFD6; color: #7A4A0E">Some values still to confirm</span></sc-if>
      <div role="group" aria-label="View" style="display: flex; padding: 3px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(0,46,56,0.12); box-shadow: 0 1px 2px rgba(0,46,56,.06)">
        <button type="button" style="border: 0; border-radius: 999px; padding: 8px 14px; font: 600 12.5px/1 Inter, sans-serif; background: #002E38; color: #FFFFFF">Marketing workspace</button>
        <button type="button" data-on-click="{{goBrief}}" style="border: 0; border-radius: 999px; padding: 8px 14px; font: 600 12.5px/1 Inter, sans-serif; background: transparent; color: #002E38; display: flex; gap: 6px; align-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path></svg>Attendee briefing</button>
      </div>
    </div>
  </sc-if>
</header>
</sc-if>

<main class="scroll" style="flex-grow: 1; overflow-y: auto; min-height: 0">

<!-- ================= HUB ================= -->
<sc-if value="{{isHub}}" hint-placeholder-val="{{ true }}">
<div class="pagepad" style="padding: 44px 48px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start">
  <div style="display: flex; flex-direction: column; min-width: 0">
    <div style="font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #C21F62; margin-bottom: 16px">Tute Marketing · Events</div>
    <h1 class="gruffy" style="font-weight: 600; font-size: 44px; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 14px">Every event, one source of truth.</h1>
    <p style="font: 400 17px/1.6 Inter, sans-serif; color: #5B6F74; max-width: 640px; margin: 0 0 36px">Plan, track and brief every event from a single record. Marketing works in the full workspace; attendees get a clean briefing built from the same data.</p>

    <div class="eyebrow" style="margin-bottom: 14px">Marketing events summary</div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="8">
        <div class="card" style="padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 8px">
          <span class="th">{{k.label}}</span>
          <span class="gruffy" style="font-size: 30px; font-weight: 600; line-height: 1; color: {{k.color}}">{{k.value}}</span>
          <span style="font: 400 12.5px/1.35 Inter, sans-serif; color: #5B6F74">{{k.sub}}</span>
        </div>
      </sc-for>
    </div>

    <div class="card" style="padding: 22px 24px; margin-bottom: 36px">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px">
        <span class="eyebrow">Timeline · Oct 2026 – Mar 2027</span>
        <span style="font: 500 12.5px/1 Inter, sans-serif; color: #5B6F74; display: flex; gap: 6px; align-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"></path><path d="M12 6v6l4 2"></path></svg>Today: {{todayLabel}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; border-top: 1px solid rgba(0,46,56,0.1)">
        <sc-for list="{{months}}" as="m" hint-placeholder-count="6">
          <div style="border-right: 1px solid rgba(0,46,56,0.08); padding: 12px 8px 4px; min-height: 132px; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: baseline; gap: 5px"><span style="font: 600 13px/1 Inter, sans-serif">{{m.label}}</span><span style="font: 500 11px/1 Inter, sans-serif; color: #62767A">{{m.year}}</span></div>
            <sc-for list="{{m.events}}" as="e" hint-placeholder-count="1">
              <button type="button" data-on-click="{{e.open}}" style="text-align: left; border: 1px solid rgba(0,46,56,0.12); background: #FBF8F4; border-radius: 10px; padding: 8px 9px; display: flex; flex-direction: column; gap: 5px">
                <span style="display: flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 99px; background: {{e.status.fg}}"></span><span style="font: 700 11px/1 Inter, sans-serif; color: #5B6F74">{{e.day}}</span></span>
                <span style="font: 600 12px/1.25 Inter, sans-serif; color: #002E38">{{e.short}}</span>
              </button>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px">
      <h2 style="font: 600 20px/1.2 Inter, sans-serif; margin: 0">Events by term</h2>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{termPills}}" as="p" hint-placeholder-count="3">
          <button type="button" data-on-click="{{p.pick}}" style="border: 1px solid rgba(0,46,56,0.14); border-radius: 999px; padding: 8px 14px; font: 600 12.5px/1 Inter, sans-serif; background: {{p.bg}}; color: {{p.fg}}">{{p.label}}</button>
        </sc-for>
      </div>
    </div>
    <sc-for list="{{terms}}" as="t" hint-placeholder-count="2">
      <div style="margin-bottom: 32px">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px"><span class="eyebrow">{{t.title}}</span><span style="flex-grow: 1; height: 1px; background: rgba(0,46,56,0.1)"></span></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
          <sc-for list="{{t.events}}" as="e" hint-placeholder-count="3">
            <button type="button" class="card evcard" data-on-click="{{e.open}}" style="text-align: left; padding: 20px; display: flex; flex-direction: column; gap: 14px; color: #002E38">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span class="pill" style="background: #F7F0E8; color: #4D6166; border: 1px solid rgba(0,46,56,0.1)">{{e.type}}</span>
                <span class="pill" style="background: {{e.status.bg}}; color: {{e.status.fg}}">{{e.status.label}}</span>
              </div>
              <div style="display: flex; justify-content: space-between; gap: 12px; align-items: flex-start">
                <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
                  <span style="font: 600 16.5px/1.3 Inter, sans-serif">{{e.name}}</span>
                  <span style="display: flex; gap: 7px; align-items: center; font: 400 13px/1.3 Inter, sans-serif; color: #5B6F74"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path></svg>{{e.date}}</span>
                  <span style="display: flex; gap: 7px; align-items: center; font: 400 13px/1.3 Inter, sans-serif; color: #5B6F74"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11Z"></path><path d="M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"></path></svg>{{e.where}}</span>
                  <span style="display: flex; gap: 7px; align-items: center; font: 400 13px/1.3 Inter, sans-serif; color: #5B6F74"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M3 3h7v7H3Z"></path><path d="M14 3h7v7h-7Z"></path><path d="M3 14h7v7H3Z"></path><path d="M14 14h7v7h-7Z"></path></svg>{{e.standLine}}</span>
                  <span style="display: flex; gap: 7px; align-items: flex-start; font: 400 13px/1.35 Inter, sans-serif; color: #5B6F74"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>{{e.audience}}</span></span>
                </div>
                <div style="flex-shrink: 0; text-align: right; display: flex; flex-direction: column; align-items: flex-end">
                  <span class="gruffy" style="font-size: 34px; font-weight: 600; line-height: 1">{{e.daysNum}}</span>
                  <span style="font: 500 11.5px/1.3 Inter, sans-serif; color: #5B6F74">{{e.daysWord}}</span>
                </div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="display: flex; justify-content: space-between; font: 500 12px/1 Inter, sans-serif; color: #5B6F74"><span>Tasks {{e.doneOf}}</span><span style="color: #002E38; font-weight: 700">{{e.progress}}%</span></div>
                <div style="height: 6px; border-radius: 4px; background: #F3E9DC; overflow: hidden"><div style="height: 100%; width: {{e.progress}}%; background: {{e.barColor}}; border-radius: 4px"></div></div>
              </div>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(0,46,56,0.08)">
                <span style="display: flex; align-items: center; gap: 8px; font: 500 12px/1.2 Inter, sans-serif; color: #5B6F74"><span style="display: flex"><span title="Marketing owner" style="width: 26px; height: 26px; border-radius: 999px; background: #002E38; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 700 9.5px/1 Inter, sans-serif; border: 2px solid #FFFFFF">{{e.ownerInit}}</span><span title="BD owner" style="width: 26px; height: 26px; border-radius: 999px; background: #66FF94; color: #002E38; display: flex; align-items: center; justify-content: center; font: 700 9.5px/1 Inter, sans-serif; border: 2px solid #FFFFFF; margin-left: -6px">{{e.bdInit}}</span></span>MKT · BD</span>
                <sc-if value="{{e.hasAlert}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: #FBD9E6; color: #951F51; gap: 5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>{{e.alert}}</span></sc-if>
                <sc-if value="{{e.noAlert}}" hint-placeholder-val="{{ true }}"><span class="pill" style="background: #D6F7E1; color: #0B6433; gap: 5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M20 6 9 17l-5-5"></path></svg>On track</span></sc-if>
              </div>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- right rail -->
  <aside style="position: sticky; top: 0; display: flex; flex-direction: column; gap: 16px; padding-top: 4px">
    <sc-if value="{{hasNext}}" hint-placeholder-val="{{ true }}">
      <div style="background: #002E38; color: #FFFFFF; border-radius: 16px; padding: 24px; box-shadow: 0 12px 40px rgba(0,46,56,.14); display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 8px; color: #66FF94"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path></svg><span style="font: 600 11px/1 Inter, sans-serif; letter-spacing: 0.14em; text-transform: uppercase">Next up</span></div>
        <div>
          <div style="font: 600 18px/1.3 Inter, sans-serif; margin-bottom: 4px">{{next.name}}</div>
          <div style="font: 400 13px/1.45 Inter, sans-serif; color: #BFCBCD">{{next.date}} · {{next.where}}</div>
        </div>
        <div style="display: flex; align-items: baseline; gap: 8px"><span class="gruffy" style="font-size: 48px; font-weight: 600; line-height: 1; color: #66FF94">{{next.daysNum}}</span><span style="font: 500 13px/1 Inter, sans-serif; color: #BFCBCD">{{next.daysWord}}</span></div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{next.alerts}}" as="a" hint-placeholder-count="3">
            <span style="display: flex; gap: 8px; align-items: center; font: 500 13px/1.35 Inter, sans-serif; color: #FFFFFF"><span style="color: #FF7BAE; display: flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg></span>{{a.label}}</span>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" data-on-click="{{next.open}}" style="border: 0; border-radius: 999px; padding: 10px 16px; background: #66FF94; color: #002E38; font: 600 13px/1 Inter, sans-serif">Open workspace</button>
          <button type="button" data-on-click="{{next.brief}}" style="border: 1px solid rgba(255,255,255,0.24); border-radius: 999px; padding: 10px 16px; background: transparent; color: #FFFFFF; font: 600 13px/1 Inter, sans-serif">Briefing</button>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{hasDecisions}}" hint-placeholder-val="{{ true }}">
    <div class="card" style="padding: 20px 20px 10px; border-color: rgba(224,54,124,0.35)">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px"><span class="eyebrow">Decisions needed</span><button type="button" data-on-click="{{goPipe}}" style="background: none; border: 0; padding: 0; font: 600 12.5px/1 Inter, sans-serif; color: #002E38; display: flex; gap: 4px; align-items: center">Pipeline<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button></div>
      <sc-for list="{{decisionRows}}" as="d" hint-placeholder-count="3">
        <div style="border-top: 1px solid rgba(0,46,56,0.08); padding: 11px 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font: 600 13.5px/1.3 Inter, sans-serif">{{d.name}}</span>
          <span style="font: 400 12px/1.3 Inter, sans-serif; color: #5B6F74">{{d.when}} · {{d.where}} · BD {{d.bd}}</span>
        </div>
      </sc-for>
    </div>
    </sc-if>
    <div class="card" style="padding: 20px 20px 10px">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px"><span class="eyebrow">Overdue across events</span><span class="pill" style="background: #E0367C; color: #FFFFFF">{{attentionCount}}</span></div>
      <sc-for list="{{attention}}" as="a" hint-placeholder-count="4">
        <button type="button" data-on-click="{{a.open}}" style="width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid rgba(0,46,56,0.08); padding: 11px 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font: 600 13.5px/1.3 Inter, sans-serif; color: #002E38">{{a.title}}</span>
          <span style="font: 400 12px/1.3 Inter, sans-serif; color: #5B6F74">{{a.event}} · {{a.owner}} · <span style="color: #C21F62; font-weight: 600">{{a.late}}</span></span>
        </button>
      </sc-for>
    </div>
    <div class="card" style="padding: 20px">

<!-- ================= MERCH INVENTORY ================= -->

  <div class="card" style="overflow: hidden">
    <div style="display: grid; grid-template-columns: 1.5fr 0.7fr repeat(6, minmax(0, 0.8fr)) 0.8fr 0.8fr 0.9fr; gap: 10px; padding: 14px 20px; background: #F7F0E8; align-items: end">

      <sc-for list="{{merchHead}}" as="h" hint-placeholder-count="6"><span class="th" style="letter-spacing: 0.04em; text-transform: none; font-size: 11.5px">{{h.short}}</span></sc-for>

    </div>
    <sc-for list="{{merchRows}}" as="m" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 1.5fr 0.7fr repeat(6, minmax(0, 0.8fr)) 0.8fr 0.8fr 0.9fr; gap: 10px; padding: 16px 20px; border-top: 1px solid rgba(0,46,56,0.08); align-items: center; font: 500 14px/1.3 Inter, sans-serif">
        <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">{{m.name}}</span><span style="font: 400 12px/1.2 Inter, sans-serif; color: #5B6F74">{{m.location}}</span></span>
        <span>{{m.total}}</span>
        <sc-for list="{{m.perEvent}}" as="x" hint-placeholder-count="6"><span style="color: #5B6F74">{{x.v}}</span></sc-for>

        <span style="font-weight: 700">{{m.remaining}}</span>
        <span style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start"><span class="pill" style="background: {{m.stockPill.bg}}; color: {{m.stockPill.fg}}">{{m.stockLabel}}</span><sc-if value="{{m.canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" data-on-click="{{m.edit}}" style="border: 1px solid rgba(0,46,56,0.16); background: #FFFFFF; color: #002E38; border-radius: 999px; padding: 6px 11px; font: 600 12px/1 Inter, sans-serif; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>Edit</button></sc-if></span>
      </div>
    </sc-for>
  </div>
</div>
</sc-if>

<!-- ================= PEOPLE ================= -->
<sc-if value="{{isPeople}}" hint-placeholder-val="{{ false }}">
<div class="pagepad" style="padding: 44px 48px 64px">
  <div style="font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #C21F62; margin-bottom: 16px">Shared record</div>
  <h1 class="gruffy" style="font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 12px">People directory</h1>
  <p style="font: 400 16px/1.6 Inter, sans-serif; color: #5B6F74; max-width: 720px; margin: 0 0 28px">Everyone is entered once here. Owners, attendees, scanner access and briefing contacts all pick from this list, and the event and task counts below update automatically.</p>
  <div style="margin: -12px 0 24px"><sc-if value="{{canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" data-on-click="{{addPerson}}" style="border: 0; background: #002E38; color: #FFFFFF; border-radius: 999px; padding: 9px 14px; font: 600 12.5px/1 Inter, sans-serif; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add person</button></sc-if></div>
  <sc-for list="{{teams}}" as="tm" hint-placeholder-count="4">
    <div style="margin-bottom: 28px">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px"><span class="eyebrow">{{tm.team}}</span><span style="flex-grow: 1; height: 1px; background: rgba(0,46,56,0.1)"></span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{tm.people}}" as="p" hint-placeholder-count="3">
          <div class="card" style="padding: 18px; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; gap: 12px; align-items: center">
              <span style="width: 40px; height: 40px; border-radius: 999px; background: #002E38; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font: 700 12px/1 Inter, sans-serif; flex-shrink: 0">{{p.init}}</span>
              <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font: 600 14.5px/1.25 Inter, sans-serif">{{p.name}}</span><span style="font: 400 12.5px/1.3 Inter, sans-serif; color: #5B6F74">{{p.role}}</span></span>
            </div>
            <sc-if value="{{p.away}}" hint-placeholder-val="{{ false }}"><span class="pill" style="align-self: flex-start; background: #E4EAF6; color: #34497A">{{p.awayL}}</span></sc-if>
            <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{ false }}"><button type="button" data-on-click="{{p.edit}}" style="border: 1px solid rgba(0,46,56,0.16); background: #FFFFFF; color: #002E38; border-radius: 999px; padding: 6px 11px; font: 600 12px/1 Inter, sans-serif; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; align-self: flex-start"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>Edit</button></sc-if>
            <div style="font: 400 12.5px/1.45 Inter, sans-serif; color: #2D4A51; border-top: 1px solid rgba(0,46,56,0.08); padding-top: 10px">{{p.events}}</div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap"><span class="pill" style="background: #F3E9DC; color: #4D6166">{{p.open}} open tasks</span><sc-if value="{{p.hasLate}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: #E0367C; color: #FFFFFF">{{p.late}} overdue</span></sc-if></div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</sc-if>

<!-- ================= PIPELINE ================= -->
<sc-if value="{{isPipe}}" hint-placeholder-val="{{ false }}">
<div class="pagepad" style="padding: 44px 48px 64px">
  <div style="font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #C21F62; margin-bottom: 16px">Not yet booked</div>
  <h1 class="gruffy" style="font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 12px">Pipeline</h1>
  <p style="font: 400 16px/1.6 Inter, sans-serif; color: #5B6F74; max-width: 720px; margin: 0 0 28px">Events not booked yet: Marketing’s pipeline and BD requests in one list. Anything within three weeks is flagged “Decide now”. Use “Score it” on any row to check whether it’s worth doing. “Approve” adds it to your events with its task plan; “Decline” moves it to the archive with your reason.</p>

  <div role="tablist" aria-label="Filter by term" style="display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px">
    <sc-for list="{{pipeTabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" data-on-click="{{t.pick}}" style="border: 1px solid rgba(0,46,56,0.16); border-radius: 999px; padding: 9px 14px; font: 600 12.5px/1 Inter, sans-serif; background: {{t.bg}}; color: {{t.fg}}; display: flex; gap: 7px; align-items: center">{{t.label}}<span style="opacity: 0.7; font-weight: 500">{{t.n}}</span></button></sc-for>
  </div>
  <sc-if value="{{notArchive}}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 12px"><h2 style="font: 600 19px/1.2 Inter, sans-serif; margin: 0">Events to decide</h2><span style="font: 400 13px/1.3 Inter, sans-serif; color: #5B6F74">From the events tracker</span></div>
  <div class="card" style="overflow: hidden; margin-bottom: 28px">
    <div style="display: grid; grid-template-columns: 3fr 1.2fr 1.2fr 0.8fr 1.3fr; gap: 12px; padding: 14px 20px; background: #F7F0E8">
      <span class="th">Event</span><span class="th">Date</span><span class="th">BD</span><span class="th">Cost</span><span class="th">Status</span>
    </div>
    <sc-for list="{{pipeRows}}" as="p" hint-placeholder-count="8">
      <div style="border-top: 1px solid rgba(0,46,56,0.08)"><div style="display: grid; grid-template-columns: 3fr 1.2fr 1.2fr 0.8fr 1.3fr; gap: 12px; padding: 13px 20px; align-items: start; font: 500 13.5px/1.35 Inter, sans-serif">
        <span style="display: flex; flex-direction: column; gap: 4px"><sc-if value="{{p.hasLink}}" hint-placeholder-val="{{ false }}"><a href="{{p.link}}" target="_blank" rel="noopener" style="font-weight: 600; color: #002E38">{{p.name}}</a></sc-if><sc-if value="{{p.noLink}}" hint-placeholder-val="{{ true }}"><span style="font-weight: 600">{{p.name}}</span></sc-if><span style="font: 400 12.5px/1.35 Inter, sans-serif; color: #5B6F74">{{p.meta}}</span><span class="pill" style="align-self: flex-start; height: 20px; font-size: 10.5px; background: {{p.srcBg}}; color: {{p.srcFg}}">{{p.srcL}}</span><sc-if value="{{p.hasLast}}" hint-placeholder-val="{{ false }}"><span class="btag" style="align-self: flex-start">Last year: {{p.last}}</span></sc-if></span>
        <span>{{p.when}}</span>
        <span style="font-weight: 600">{{p.bd}}</span>
        <span>{{p.cost}}</span>
        <span style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start"><sc-if value="{{p.isUrgent}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background: #E0367C; color: #FFFFFF">Decide now</span></sc-if><button type="button" class="pill" data-on-click="{{p.toggleStatus}}" title="Change status" style="border: 0; gap: 5px; background: {{p.st.bg}}; color: {{p.st.fg}}">{{p.st.label}}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button><sc-if value="{{p.statusOpen}}" hint-placeholder-val="{{ false }}"><span role="menu" style="display: flex; flex-direction: column; gap: 4px; padding: 6px; background: #FFFFFF; border: 1px solid rgba(0,46,56,0.14); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,46,56,0.12)"><sc-for list="{{p.statusOpts}}" as="o" hint-placeholder-count="4"><button type="button" role="menuitem" data-on-click="{{o.pick}}" style="text-align: left; border: 1px solid {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; border-radius: 999px; padding: 6px 11px; font: 600 11.5px/1 Inter, sans-serif; white-space: nowrap">{{o.label}}</button></sc-for></span></sc-if><button type="button" data-on-click="{{p.sc.toggle}}" aria-label="Assess this event" style="border: 1px solid rgba(0,46,56,0.18); background: {{p.sc.btnBg}}; color: {{p.sc.btnFg}}; border-radius: 999px; padding: 5px 10px; font: 600 11.5px/1 Inter, sans-serif; white-space: nowrap">{{p.sc.btn}}</button><sc-if value="{{p.canAct}}" hint-placeholder-val="{{ true }}"><span style="display: flex; gap: 6px"><button type="button" data-on-click="{{p.act.startApprove}}" style="border: 0; background: #66FF94; color: #002E38; border-radius: 999px; padding: 6px 11px; font: 700 11.5px/1 Inter, sans-serif">Approve</button><button type="button" data-on-click="{{p.act.startDecline}}" style="border: 1px solid rgba(149,31,81,0.35); background: #FFFFFF; color: #951F51; border-radius: 999px; padding: 5px 10px; font: 600 11.5px/1 Inter, sans-serif">Decline</button></span></sc-if></span>
      </div>
      <sc-if value="{{p.act.open}}" hint-placeholder-val="{{ false }}">
        <div style="margin: 0 20px 18px; padding: 16px 18px; border-radius: 14px; background: #F7F0E8; border: 1px solid rgba(0,46,56,0.12); display: flex; flex-direction: column; gap: 10px">
          <sc-if value="{{p.act.isDecline}}" hint-placeholder-val="{{ false }}">
            <label for="{{p.act.inputId}}" style="font: 600 13.5px/1.3 Inter, sans-serif">Why are we saying no? <span style="font-weight: 400; color: #5B6F74">(optional, kept in the archive)</span></label>
            <input id="{{p.act.inputId}}" type="text" data-on-change="{{p.act.setDraft}}" placeholder="e.g. No exhibitors allowed, too costly, clashes with another event" style="background: #FFFFFF">
            <span style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" data-on-click="{{p.act.confirmDecline}}" style="border: 0; background: #951F51; color: #FFFFFF; border-radius: 999px; padding: 9px 14px; font: 600 12.5px/1 Inter, sans-serif">Decline and archive</button><button type="button" data-on-click="{{p.act.cancel}}" style="border: 1px solid rgba(0,46,56,0.18); background: #FFFFFF; color: #002E38; border-radius: 999px; padding: 9px 14px; font: 600 12.5px/1 Inter, sans-serif">Cancel</button></span>
          </sc-if>
          <sc-if value="{{p.act.isApprove}}" hint-placeholder-val="{{ false }}">
            <span style="font: 500 13.5px/1.45 Inter, sans-serif">{{p.act.approveMsg}}</span>
            <sc-if value="{{p.act.needsDate}}" hint-placeholder-val="{{ false }}"><label for="{{p.act.inputId}}" style="font: 600 13px/1.3 Inter, sans-serif">Event date</label><input id="{{p.act.inputId}}" type="date" data-on-change="{{p.act.setDraft}}" style="background: #FFFFFF; max-width: 220px"></sc-if>
            <span style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" data-on-click="{{p.act.confirmApprove}}" style="border: 0; background: #66FF94; color: #002E38; border-radius: 999px; padding: 9px 14px; font: 600 12.5px/1 Inter, sans-serif">Add to events</button><button type="button" data-on-click="{{p.act.cancel}}" style="border: 1px solid rgba(0,46,56,0.18); background: #FFFFFF; color: #002E38; border-radius: 999px; padding: 9px 14px; font: 600 12.5px/1 Inter, sans-serif">Cancel</button></span>
          </sc-if>
          <sc-if value="{{p.act.hasErr}}" hint-placeholder-val="{{ false }}"><span style="font: 600 12.5px/1.3 Inter, sans-serif; color: #951F51">{{p.act.err}}</span></sc-if>
        </div>
      </sc-if>
      <sc-if value="{{p.sc.open}}" hint-placeholder-val="{{ false }}">
        <div style="margin: 0 20px 18px; padding: 20px 22px; border-radius: 14px; background: #F7F0E8; border: 1px solid rgba(0,46,56,0.1)">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 6px">
            <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span class="eyebrow">Is it worth doing?</span><span style="font: 600 16px/1.3 Inter, sans-serif">{{p.name}}</span></div>
            <div style="display: flex; align-items: center; gap: 12px"><span class="gruffy" style="font-size: 34px; font-weight: 600; line-height: 1">{{p.sc.total}}<span style="font: 500 14px/1 Inter, sans-serif; color: #5B6F74">/24</span></span><span class="pill" style="background: {{p.sc.verdict.bg}}; color: {{p.sc.verdict.fg}}">{{p.sc.verdict.label}}</span></div>
          </div>
          <sc-if value="{{p.hasFacts}}" hint-placeholder-val="{{ false }}">
            <div style="background: #FFFFFF; border-radius: 12px; padding: 14px 16px; margin: 10px 0 8px; display: flex; flex-direction: column; gap: 6px">
              <span class="th">What we know</span>
              <sc-for list="{{p.facts}}" as="x" hint-placeholder-count="4"><span style="font: 400 13px/1.45 Inter, sans-serif; color: #2D4A51; display: flex; gap: 8px"><span style="color: #1F9D57">•</span><span>{{x.f}}</span></span></sc-for>
              <sc-if value="{{p.hasWaiting}}" hint-placeholder-val="{{ false }}"><span style="font: 600 12.5px/1.4 Inter, sans-serif; color: #34497A; margin-top: 4px">Waiting on: {{p.waiting}}</span></sc-if>
              <sc-if value="{{p.hasContact}}" hint-placeholder-val="{{ false }}"><span style="font: 500 12.5px/1.4 Inter, sans-serif; color: #5B6F74">Contact: {{p.contact}}</span></sc-if>
            </div>
          </sc-if>
          <sc-for list="{{p.sc.rows}}" as="q" hint-placeholder-count="8">
            <div style="display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); gap: 14px; padding: 12px 0; border-top: 1px solid rgba(0,46,56,0.1); align-items: center">
              <div style="display: flex; flex-direction: column; gap: 3px"><span style="font: 600 13.5px/1.3 Inter, sans-serif">{{q.n}}. {{q.title}}</span><span style="font: 400 12px/1.4 Inter, sans-serif; color: #5B6F74">{{q.hint}}</span><sc-if value="{{q.hasWhy}}" hint-placeholder-val="{{ false }}"><span style="font: 500 12px/1.4 Inter, sans-serif; color: #0B5560">Hub data: {{q.why}}</span></sc-if></div>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
                <sc-for list="{{q.opts}}" as="o" hint-placeholder-count="3"><button type="button" data-on-click="{{o.pick}}" style="text-align: left; border: 1px {{o.bs}} {{o.bd}}; background: {{o.bg}}; color: {{o.fg}}; border-radius: 10px; padding: 8px 10px; font: 500 12px/1.3 Inter, sans-serif"><span style="font-weight: 700">{{o.v}}</span> · {{o.label}}</button></sc-for>
              </div>
            </div>
          </sc-for>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid rgba(0,46,56,0.1)">
            <span style="font: 400 12px/1.45 Inter, sans-serif; color: #5B6F74; max-width: 560px">Dashed answers are suggested from Hub data; click any answer to set it. 19+ do it · 14-18 only if the BD is keen · under 14 skip · a 1 on audience fit is an automatic skip.</span>
            <span style="display: flex; gap: 8px"><button type="button" data-on-click="{{p.sc.clear}}" style="border: 1px solid rgba(0,46,56,0.18); background: #FFFFFF; color: #002E38; font: 600 12px/1 Inter, sans-serif; border-radius: 999px; padding: 8px 14px">Clear my answers</button><button type="button" data-on-click="{{p.sc.close}}" style="border: 0; background: #002E38; color: #FFFFFF; font: 600 12px/1 Inter, sans-serif; border-radius: 999px; padding: 8px 14px">Done</button></span>
          </div>
        </div>
      </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{noPipe}}" hint-placeholder-val="{{ false }}"><div style="padding: 18px 20px; border-top: 1px solid rgba(0,46,56,0.08); font: 400 13.5px/1.4 Inter, sans-serif; color: #5B6F74">Nothing to decide for this term.</div></sc-if>
  </div>

  </sc-if>
  <sc-if value="{{isArchive}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 12px"><h2 style="font: 600 19px/1.2 Inter, sans-serif; margin: 0">Declined archive</h2><span style="font: 400 13px/1.3 Inter, sans-serif; color: #5B6F74">Events we said no to, and why</span></div>
    <div class="card" style="overflow: hidden; margin-bottom: 28px">
      <div style="display: grid; grid-template-columns: 2.4fr 1.1fr 2.4fr 1fr 0.8fr; gap: 12px; padding: 14px 20px; background: #F7F0E8"><span class="th">Event</span><span class="th">Event date</span><span class="th">Why we said no</span><span class="th">Declined</span><span class="th"></span></div>
      <sc-for list="{{declinedRows}}" as="x" hint-placeholder-count="2">
        <div style="display: grid; grid-template-columns: 2.4fr 1.1fr 2.4fr 1fr 0.8fr; gap: 12px; padding: 13px 20px; border-top: 1px solid rgba(0,46,56,0.08); align-items: start; font: 500 13.5px/1.35 Inter, sans-serif">
          <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 600">{{x.name}}</span><span style="font: 400 12.5px/1.35 Inter, sans-serif; color: #5B6F74">{{x.meta}}</span></span>

          <span style="color: #2D4A51">{{x.why}}</span>
          <span style="color: #5B6F74">{{x.on}}</span>
